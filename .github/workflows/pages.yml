# Build the static (offline-Jev) export and publish it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build static export
        run: bun run build
        env:
          # next.config switches to output: 'export' and drops the /api route.
          STATIC_EXPORT: "1"
          # "/<repo>" for project sites, "" for a <user>.github.io repo.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Pages has no server, so the browser always uses the offline classifier.
          NEXT_PUBLIC_USE_MOCK: "true"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
